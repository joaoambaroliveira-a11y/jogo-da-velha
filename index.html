<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4x4 - Jogo com Amigos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .players {
      display: flex;
      gap: 40px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .player label {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    .player input {
      padding: 12px 18px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: #0f3460;
      color: #fff;
      text-align: center;
      width: 180px;
      outline: none;
      transition: 0.2s;
    }

    .player input:focus {
      background: #1a4b8c;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: #0f3460;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .cell {
      width: 90px;
      height: 90px;
      background: #e94560;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: bold;
      color: white;
      user-select: none;
    }

    .cell:hover {
      transform: scale(1.05);
      background: #ff6b81;
    }

    .cell:active {
      transform: scale(0.95);
    }

    @media (max-width: 500px) {
      .cell {
        width: 70px;
        height: 70px;
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <h1>4 × 4</h1>

  <div class="players">
    <div class="player">
      <label>Jogador 1</label>
      <input type="text" placeholder="Nome do jogador 1" id="p1">
    </div>
    <div class="player">
      <label>Jogador 2</label>
      <input type="text" placeholder="Nome do jogador 2" id="p2">
    </div>
  </div>

  <div class="board" id="board">
    <!-- 16 células 4x4 -->
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </div>

</body>
</html>
